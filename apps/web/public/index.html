<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <title>Clipstead</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header class="topbar" id="topbar" hidden></header>
    <p class="offline" id="offline" role="status" hidden>You are offline. Changes will fail until the connection returns.</p>
    <main id="main" tabindex="-1">
      <p class="muted">Loading…</p>
      <noscript><p>Clipstead needs JavaScript enabled.</p></noscript>
    </main>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
