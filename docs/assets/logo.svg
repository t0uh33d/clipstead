<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Clipstead</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B8CFF"/>
      <stop offset="1" stop-color="#2447C9"/>
    </linearGradient>
    <linearGradient id="clip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22377F"/>
      <stop offset="1" stop-color="#15225A"/>
    </linearGradient>
    <filter id="tile-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="paper-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0B1A4D" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS icon grid: an 824-pt rounded square inside a 1024 canvas. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#tile-shadow)"/>
  <!-- A clipboard… -->
  <rect x="290" y="300" width="444" height="530" rx="60" fill="#FFFFFF" filter="url(#paper-shadow)"/>
  <!-- …whose clip is a little house: your clipboard's own home. -->
  <path d="M512 196 L644 300 V356 H380 V300 Z" fill="url(#clip)" stroke="url(#clip)" stroke-width="24" stroke-linejoin="round"/>
  <circle cx="512" cy="306" r="26" fill="#FFFFFF"/>
  <rect x="370" y="474" width="284" height="44" rx="22" fill="#2F5BD3"/>
  <rect x="370" y="572" width="284" height="44" rx="22" fill="#2F5BD3" opacity="0.7"/>
  <rect x="370" y="670" width="190" height="44" rx="22" fill="#2F5BD3" opacity="0.45"/>
</svg>
